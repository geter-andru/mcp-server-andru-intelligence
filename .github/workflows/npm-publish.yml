name: Publish MCP Server to npm

# Triggered manually or on version tag push.
# Relocated from the superproject (no git remote → never ran) to this package's
# own repo, so it runs at the repo root (no packages/ working-directory).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'mcp-v*'  # e.g., mcp-v1.4.1

permissions:
  contents: read
  id-token: write  # Required for npm provenance

jobs:
  # Job 1: Validate — lint, test, scan artifact for secrets
  validate:
    name: Validate Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Scan packed artifact for secrets
        run: |
          echo "### Artifact Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Pack the artifact and list contents
          npm pack --dry-run 2>&1 | tee pack-contents.txt

          # Check for secret patterns in packed file list
          ISSUES=""

          # Check if any .env files are included
          if grep -i "\.env" pack-contents.txt | grep -v "node_modules"; then
            ISSUES="$ISSUES\n- .env file found in package"
          fi

          # Scan actual packed files for secret patterns
          npm pack 2>/dev/null
          TARBALL=$(ls *.tgz)
          tar -tzf "$TARBALL" > file-list.txt

          # Extract and scan source files for hardcoded secrets
          mkdir -p _scan
          tar -xzf "$TARBALL" -C _scan
          if grep -rE "(sk-ant-[A-Za-z0-9_-]{40}|SUPABASE_SERVICE_ROLE|sk_live_[A-Za-z0-9]{24}|eyJ[A-Za-z0-9_-]{100}\.eyJ)" _scan/ --include="*.js" --include="*.ts" --include="*.json" 2>/dev/null | grep -v "node_modules" | grep -v "package.json"; then
            ISSUES="$ISSUES\n- Secret patterns found in source files"
          fi

          # Check for telemetry endpoints that shouldn't be hardcoded
          if grep -rE "https?://[a-z]+\.(posthog|amplitude|segment|mixpanel)\." _scan/ --include="*.js" 2>/dev/null; then
            ISSUES="$ISSUES\n- Telemetry endpoint found in published package"
          fi

          rm -rf _scan "$TARBALL"

          if [ -n "$ISSUES" ]; then
            echo "BLOCKED: Security issues found in artifact:" >> $GITHUB_STEP_SUMMARY
            echo -e "$ISSUES" >> $GITHUB_STEP_SUMMARY
            echo ""
            echo "BLOCKED: Security issues found:"
            echo -e "$ISSUES"
            exit 1
          else
            echo "Artifact scan passed — no secrets or telemetry found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify package.json has files field
        run: |
          if ! node -e "const p = require('./package.json'); if (!p.files) { process.exit(1); }"; then
            echo "WARNING: package.json missing 'files' field — entire directory will be published"
            echo "Consider adding: \"files\": [\"src/\", \"README.md\", \"LICENSE\"]"
          fi

  # Job 2: Generate SBOM
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json --output-reproducible

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90

      - name: SBOM summary
        run: |
          DEPS=$(node -e "const s = require('./sbom.json'); console.log(s.components?.length || 0)")
          echo "### SBOM Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Format:** CycloneDX JSON" >> $GITHUB_STEP_SUMMARY
          echo "- **Dependencies:** $DEPS components" >> $GITHUB_STEP_SUMMARY

  # Job 3: Publish with provenance
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [validate, sbom]
    if: ${{ !inputs.dry_run }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Trusted publishing (OIDC, set up on npmjs.com 2026-10-06) needs npm >= 11.5.1; Node 22 ships
      # npm 10. No NPM_TOKEN: npm exchanges this job's GitHub identity for a one-time publish token.
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest

      - name: Publish with provenance
        run: npm publish --provenance --access public

      - name: Publish summary
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "### Published to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Package:** mcp-server-andru-intelligence@$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Provenance:** Enabled (npm attestation)" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** https://www.npmjs.com/package/mcp-server-andru-intelligence" >> $GITHUB_STEP_SUMMARY
